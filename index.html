<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <title>אישור הגעה לחתונה</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="styles.css">
  <script>
    function handleAttendanceChange() {
      const attendanceSelect = document.querySelector('select[name="attendance"]');
      const guestsInput = document.querySelector('input[name="guests"]');
      
      if (attendanceSelect.value === 'no') {
        guestsInput.value = '0';
      }
    }
    
    document.addEventListener('DOMContentLoaded', function() {
      const attendanceSelect = document.querySelector('select[name="attendance"]');
      attendanceSelect.addEventListener('change', handleAttendanceChange);
    });
  </script>
</head>
<body>

  <!-- TOP SECTION: IMAGE + INVITATION -->
  <section class="hero">
    <div class="card">
      <div class="hero-grid">

        <!-- IMAGE PLACEHOLDER (removed). A background image may be added here later. -->
        <div class="hero-image-wrapper">
        </div>

        <!-- TEXT + BUTTON -->
        <div class="hero-text">
          <p class="title">הנכם מוזמנים לחינה של</p>
          <h1 class="names"> זאב פישר &amp; נועם חממי </h1>

          <div class="details">
            <p class="rtl center" dir="rtl" lang="he">אנו שמחים להזמין אתכם לחגוג עמנו</p>
            <p class="date-hebrew rtl" dir="rtl" lang="he">יום שני - כ"ז אדר תשפ"ו</p>
            <p class="date-gregorian">16/2/2026</p>
            <p class="info-bold"><span class="location-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
                  <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5S10.62 6.5 12 6.5s2.5 1.12 2.5 2.5S13.38 11.5 12 11.5z"/>
                </svg>
              </span>פבריקה, 14 החרושת כפר סבא</p>
            <p class="info-bold">קבלת פנים: 19:15</p>
            <p class="info-bold">טקס החינה: 20:00</p>
            <div class="divider"></div>
          </div>

          <a href="#rsvp-form" class="primary-btn">אשר הגעה</a>
        </div>
      </div>
    </div>
  </section>

  <!-- RSVP FORM -->
  <section class="rsvp-section" id="rsvp-form">
    <div class="rsvp-card">
      <h2 style="margin-top:0; margin-bottom:4px;">אישור הגעה</h2>
      <p class="small-note rtl" dir="rtl" lang="he">
        אנא מלאו את כל הפרטים מטה. לעדכון הפרטים מלאו את הטופס מחדש עם אותו טלפון, והתשובה הקודמת תעודכן.
      </p>

      <form method="POST" action="https://script.google.com/macros/s/AKfycbyVEPTlFKlEseNpiOBhg_sd8YKNq20yVqXlxW7QDeN1c5M_DlxHMgZhlfJvMLKg8YlLWw/exec">
        <label>
          שם מלא *
          <input type="text" name="name" required />
        </label>

        <label>
          טלפון *
          <input type="tel" name="contact" pattern="[0-9]+" inputmode="numeric" required oninput="this.value = this.value.replace(/[^0-9]/g, '')" />
        </label>

        <label>
          האם תשתתפו? *
          <select name="attendance" required>
            <option value="">בחר/י…</option>
            <option value="yes">כן, אבוא</option>
            <option value="no">לא, לא אוכל להגיע</option>
          </select>
        </label>

        <label>
          מספר מבוגרים (כולל אותך)
          <input type="number" name="adults" min="0" max="10" value="1" />
        </label>
        
        <label>
          מספר ילדים
          <input type="number" name="kids" min="0" max="10" value="0" />
        </label>

        <label>
          הערות (אלרגיות, וכו')
          <textarea name="notes"></textarea>
        </label>

        <button type="submit">Send RSVP</button>
      </form>
    </div>
  </section>

</body>
</html>
